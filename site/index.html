<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OSWE v5 Embed Vision - GROK TEST 2026-08-13</title>
  <style>
    :root{
      color-scheme:light;
      --canvas:oklch(97.7% .007 165);
      --surface:oklch(99.1% .004 165);
      --surface-2:oklch(95.8% .009 165);
      --ink:oklch(24% .018 165);
      --muted:oklch(50% .015 165);
      --line:oklch(87% .012 165);
      --line-strong:oklch(76% .02 165);
      --accent:oklch(48% .105 166);
      --accent-soft:oklch(93.5% .035 166);
      --code:oklch(18% .022 165);
      --code-ink:oklch(92% .012 165);
      --code-muted:oklch(69% .025 165);
      --edit:oklch(38% .065 75);
      --edit-ink:oklch(91% .08 83);
      --edit-panel:oklch(94% .055 83);
      --edit-panel-ink:oklch(34% .065 70);
      --edit-panel-line:oklch(76% .09 76);
      --sans:"Segoe UI",Inter,system-ui,sans-serif;
      --mono:"Cascadia Code","Cascadia Mono",Consolas,monospace;
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;overflow:hidden;background:var(--canvas);color:var(--ink);font-family:var(--sans)}
    button,input,select{font:inherit}
    button,select{cursor:pointer}
    button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .shell{height:100dvh;min-height:520px;display:grid;grid-template-rows:54px minmax(0,1fr);overflow:hidden;background:var(--surface)}
    .toolbar{display:grid;grid-template-columns:300px minmax(260px,720px) minmax(220px,1fr);align-items:center;gap:12px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
    .brand{display:flex;align-items:center;gap:9px;min-width:0;font-weight:760;letter-spacing:-.02em}
    .brand-mark{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;background:var(--ink);color:var(--surface);font:700 11px var(--mono)}
    .brand small{color:var(--muted);font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase}
    .vision{border:1px solid var(--line-strong);border-radius:999px;padding:2px 6px;color:var(--muted);font-size:9px;letter-spacing:.08em;text-transform:uppercase}
    .search-wrap{position:relative;min-width:0}
    .search-wrap svg{position:absolute;left:11px;top:50%;width:16px;height:16px;transform:translateY(-50%);color:var(--muted)}
    #search{width:100%;height:36px;border:1px solid var(--line-strong);border-radius:8px;padding:0 42px 0 34px;background:var(--surface-2);color:var(--ink)}
    #search::placeholder{color:var(--muted)}
    #search:disabled{opacity:.55;cursor:not-allowed}
    .search-key{position:absolute;right:9px;top:8px;border:1px solid var(--line);border-bottom-color:var(--line-strong);border-radius:4px;padding:1px 5px;color:var(--muted);background:var(--surface);font:11px var(--mono)}
    .toolbar-actions{display:flex;justify-content:flex-end;align-items:center;gap:8px;min-width:0}
    .mode-label{font-size:12px;color:var(--muted)}
    #utility-select{height:34px;max-width:150px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink);padding:0 28px 0 9px}
    .workspace{min-height:0;display:grid;grid-template-columns:300px minmax(0,1fr);background:var(--canvas)}
    .shell:not([data-mode="functions"]) .workspace{display:none}
    .utility{min-height:0;display:none;grid-template-columns:minmax(300px,.8fr) minmax(0,1.2fr);gap:12px;padding:12px;background:var(--canvas)}
    .shell[data-mode="regex"] .utility[data-tool="regex"],.shell[data-mode="request"] .utility[data-tool="request"],.shell[data-mode="oracle"] .utility[data-tool="oracle"]{display:grid}
    .tool-pane{min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
    .tool-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 11px;border-bottom:1px solid var(--line)}
    .tool-head h2{margin:0;font-size:11px;letter-spacing:.07em;text-transform:uppercase}
    .tool-state{color:var(--muted);font-size:10px}
    .tool-state[data-level="literal"]{color:var(--edit-panel-ink);font-weight:800}
    .tool-body{min-height:0;overflow:auto;display:grid;align-content:start;gap:10px;padding:11px}
    .tool-field{display:grid;gap:5px}
    .tool-field label{color:var(--muted);font-size:9px;font-weight:760;letter-spacing:.07em;text-transform:uppercase}
    .tool-input,.tool-textarea,.tool-output{width:100%;border:1px solid var(--line-strong);border-radius:7px;padding:9px;background:var(--surface-2);color:var(--ink);font:12px/1.45 var(--mono)}
    .tool-textarea{min-height:180px;resize:vertical}
    .tool-output{min-height:120px;overflow:auto;white-space:pre-wrap;word-break:break-word;background:var(--code);color:var(--code-ink)}
    .tool-buttons{display:flex;flex-wrap:wrap;gap:7px}
    .tool-buttons button{min-height:32px;border:1px solid var(--line-strong);border-radius:6px;padding:0 9px;background:var(--surface);color:var(--ink);font-size:11px;font-weight:650}
    .tool-buttons .primary{border-color:var(--accent);background:var(--accent);color:oklch(98% .006 165)}
    .master{min-height:0;display:grid;grid-template-rows:46px minmax(0,1fr);border-right:1px solid var(--line);background:var(--surface)}
    .master-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 10px;border-bottom:1px solid var(--line);color:var(--muted)}
    #category-filter{min-width:0;max-width:190px;height:30px;border:1px solid var(--line);border-radius:6px;padding:0 28px 0 8px;background:var(--surface-2);color:var(--ink);font-size:11.5px;font-weight:650}
    .result-count{font-weight:550;letter-spacing:0;text-transform:none}
    .result-list{min-height:0;overflow:auto;overscroll-behavior:contain}
    .result{width:100%;min-height:57px;display:grid;gap:3px;padding:8px 12px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;text-align:left;color:var(--ink)}
    .result:hover{background:var(--surface-2)}
    .result[aria-selected="true"]{background:var(--accent-soft)}
    .result-top{display:flex;align-items:center;gap:7px;min-width:0}
    .result-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:650 12.5px var(--mono)}
    .result-category{flex:0 0 auto;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.04em}
    .result-summary{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:11.5px}
    .empty{padding:24px 14px;color:var(--muted);font-size:13px}
    .detail{min-width:0;min-height:0;display:grid;grid-template-rows:auto auto auto minmax(0,1fr);background:var(--surface)}
    .detail-head{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px;padding:12px 16px 10px;border-bottom:1px solid var(--line)}
    .detail-title-row{display:flex;align-items:center;gap:9px;min-width:0}
    .view-back{display:none;width:32px;height:32px;border:1px solid var(--line);border-radius:7px;background:var(--surface);color:var(--ink)}
    .title-wrap{min-width:0}
    .title-wrap h1{margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:18px;line-height:1.2;letter-spacing:-.025em}
    .title-meta{margin-top:3px;color:var(--muted);font-size:11px}
    .copy-ready{height:36px;border:1px solid var(--accent);border-radius:7px;padding:0 12px;background:var(--accent);color:oklch(98% .006 165);font-weight:700}
    .copy-ready:hover{filter:brightness(.95)}
    .copy-ready kbd{margin-left:7px;color:oklch(91% .02 165);font:10px var(--mono)}
    .copy-cluster{display:flex;align-items:center;gap:6px}
    .copy-menu{position:relative}
    .copy-menu>summary{height:36px;display:flex;align-items:center;list-style:none;border:1px solid var(--line-strong);border-radius:7px;padding:0 10px;background:var(--surface);font-size:12px;font-weight:650;cursor:pointer}
    .copy-menu>summary::-webkit-details-marker{display:none}
    .copy-menu-panel{position:absolute;right:0;top:41px;z-index:12;width:170px;display:grid;padding:5px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);box-shadow:0 12px 28px oklch(20% .02 165/.16)}
    .copy-menu-panel button{border:0;border-radius:5px;padding:8px;text-align:left;background:transparent;color:var(--ink);font-size:12px}
    .copy-menu-panel button:hover{background:var(--surface-2)}
    .facts{display:grid;grid-template-columns:minmax(0,1fr);border-bottom:1px solid var(--line);background:var(--surface)}
    .fact{min-width:0;padding:8px 16px}
    .fact-label{display:block;margin-bottom:3px;color:var(--muted);font-size:9px;font-weight:760;letter-spacing:.08em;text-transform:uppercase}
    .fact-value{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
    .edit-banner{display:grid;gap:6px;padding:8px 16px;border-top:1px solid var(--edit-panel-line);border-bottom:1px solid var(--edit-panel-line);background:var(--edit-panel);color:var(--edit-panel-ink)}
    .edit-banner-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .edit-banner-title{font-size:10px;font-weight:850;letter-spacing:.09em;text-transform:uppercase}
    .jump-edit{height:26px;border:1px solid var(--edit-panel-line);border-radius:6px;padding:0 8px;background:oklch(98% .018 83);color:var(--edit-panel-ink);font-size:10px;font-weight:750}
    .jump-edit:hover{background:var(--surface)}
    .edit-chips{max-height:50px;display:flex;flex-wrap:wrap;align-content:flex-start;gap:4px;overflow:auto;overscroll-behavior:contain}
    .edit-chip{min-height:22px;display:inline-flex;align-items:center;border:1px solid var(--edit-panel-line);border-radius:5px;padding:2px 7px;background:oklch(98% .016 83);color:var(--edit-panel-ink);font:650 10.5px var(--mono);white-space:nowrap}
    .requirements{display:flex;gap:8px;align-items:center;padding:5px 16px;overflow:hidden;color:var(--muted);font-size:10.5px;white-space:nowrap}
    .requirements span{overflow:hidden;text-overflow:ellipsis}
    .practical{border-bottom:1px solid var(--line);background:var(--surface-2)}
    .practical>summary{list-style:none;padding:7px 16px;color:var(--muted);font-size:10px;font-weight:760;letter-spacing:.07em;text-transform:uppercase;cursor:pointer}
    .practical>summary::-webkit-details-marker{display:none}
    .practical>summary::after{content:"show";float:right;font-weight:550;letter-spacing:0;text-transform:none}
    .practical[open]>summary::after{content:"hide"}
    .practical-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:0 16px 10px}
    .practical-item{min-width:0;color:var(--ink);font-size:11px}
    .practical-item b{display:block;margin-bottom:2px;color:var(--muted);font-size:9px;letter-spacing:.06em;text-transform:uppercase}
    .practical-item code{font:11px var(--mono)}
    .practical-wide{grid-column:1/-1}
    .code-wrap{min-height:0;position:relative;overflow:auto;background:var(--code);overscroll-behavior:contain}
    .code{display:block;min-width:max-content;padding:13px 0 30px;color:var(--code-ink);font:12.5px/1.52 var(--mono);counter-reset:line}
    .code-line{display:block;min-height:19px;padding:0 16px 0 52px;white-space:pre;counter-increment:line}
    .code-line::before{content:counter(line);position:absolute;width:34px;margin-left:-44px;color:var(--code-muted);text-align:right;user-select:none}
    .code-line.comment{color:oklch(70% .045 155)}
    .code-line.edit{background:var(--edit);color:var(--edit-ink)}
    .code-line.edit-jump-target{outline:2px solid oklch(82% .16 82);outline-offset:-2px}
    .toast{position:fixed;right:14px;bottom:14px;z-index:20;max-width:min(360px,calc(100vw - 28px));padding:9px 12px;border:1px solid var(--line-strong);border-radius:7px;background:var(--ink);color:var(--surface);font-size:12px;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity 160ms ease-out,transform 160ms ease-out}
    .toast.show{opacity:1;transform:translateY(0)}
    .copy-fallback[hidden]{display:none}
    .copy-fallback{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:14px;background:oklch(20% .02 165/.28)}
    .copy-fallback-panel{width:min(760px,100%);overflow:hidden;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);box-shadow:0 20px 50px oklch(20% .02 165/.28)}
    .copy-fallback-head{min-height:44px;display:flex;align-items:center;gap:10px;padding:7px 9px 7px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
    .copy-fallback-head strong{font-size:13px}.copy-fallback-head span{color:var(--muted);font-size:12px}.copy-fallback-close{margin-left:auto;width:32px;height:32px;padding:0;font-size:20px;line-height:1}
    .copy-buffer{display:block;width:100%;height:min(240px,40vh);resize:vertical;border:0;padding:12px;background:var(--surface);color:var(--ink);font:12px/1.45 var(--mono)}
    .fallback{height:100dvh;overflow:auto;padding:18px;background:var(--surface);font-family:var(--sans)}
    @media(max-width:860px){
      .toolbar{grid-template-columns:230px minmax(220px,1fr) auto}
      .mode-label{display:none}
      .workspace{grid-template-columns:270px minmax(0,1fr)}
      .utility{grid-template-columns:minmax(260px,.8fr) minmax(0,1.2fr)}
    }
    @media(max-width:680px){
      .shell{grid-template-rows:98px minmax(0,1fr)}
      .toolbar{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:38px 38px;padding:6px 9px;gap:4px 8px}
      .brand{grid-column:1}.toolbar-actions{grid-column:2}.search-wrap{grid-column:1/-1;grid-row:2}
      .workspace{position:relative;display:block;min-height:0}
      .utility{grid-template-columns:1fr;overflow:auto;padding:8px}.tool-pane{min-height:300px}.tool-textarea{min-height:140px}
      .master,.detail{position:absolute;inset:0;border:0}
      .shell[data-view="list"] .detail{display:none}
      .shell[data-view="detail"] .master{display:none}
      .view-back{display:grid;place-items:center}
      .detail-head{padding:9px 10px;gap:8px}
      .fact{padding:7px 12px}
      .edit-banner{padding:7px 12px}.edit-chips{max-height:50px}
      .requirements{padding:5px 12px}
      .copy-ready{padding:0 9px}.copy-ready kbd{display:none}
      .copy-menu>summary{padding:0 8px}
      .practical>summary{padding:7px 12px}.practical-grid{grid-template-columns:1fr;padding:0 12px 9px}.practical-wide{grid-column:auto}
      .title-wrap h1{font-size:15px}
      .code{font-size:12px}
    }
  </style>
</head>
<body data-prototype="v5-design-vision">
  <div id="shell" class="shell" data-view="list" data-mode="functions">
    <header class="toolbar">
      <div class="brand"><span class="brand-mark">V5</span><span>OSWE Functions [GROK TEST]</span><small>115</small><span class="vision">vision</span></div>
      <label class="search-wrap" for="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" d="m21 21-4.3-4.3m2.3-5.2a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
        <input id="search" autocomplete="off" spellcheck="false" placeholder="Search code, axes, aliases...">
        <kbd class="search-key">/</kbd>
      </label>
      <div class="toolbar-actions"><span class="mode-label">Mode</span><select id="utility-select" aria-label="Mode"><option value="functions">Functions</option><option value="regex">Regex helper</option><option value="request">Request scaffold</option><option value="oracle">Oracle diff</option></select></div>
    </header>
    <!-- REST OF THE ORIGINAL FILE CONTENT REMAINS THE SAME - THIS IS A TEST CHANGE ONLY ON TITLE AND BRAND -->
    <section class="workspace">
      <aside class="master" aria-label="Function results">
        <div class="master-head"><select id="category-filter" aria-label="Category"></select><span id="result-count" class="result-count"></span></div>
        <div id="result-list" class="result-list"></div>
      </aside>
      <main id="detail" class="detail">
        <header class="detail-head">
          <div class="detail-title-row">
            <button id="back-to-list" class="view-back" type="button" aria-label="Back to functions">&#8592;</button>
            <div class="title-wrap"><h1 id="active-title"></h1><div id="active-meta" class="title-meta"></div></div>
          </div>
          <div class="copy-cluster">
            <button class="copy-ready" type="button" data-copy="ready">Copy ready block <kbd>C</kbd></button>
            <details class="copy-menu"><summary>Copy...</summary><div class="copy-menu-panel">
              <button type="button" data-copy="function">Function only</button>
              <button type="button" data-copy="call">Call only</button>
              <button type="button" data-copy="both">Function + call</button>
              <button type="button" data-copy="edit">EDIT knobs</button>
            </div></details>
          </div>
        </header>
        <section class="facts">
          <div class="fact"><span class="fact-label">Use when</span><span id="active-use" class="fact-value"></span></div>
          <div id="edit-banner" class="edit-banner">
            <div class="edit-banner-head"><span class="edit-banner-title">Edit first</span><button id="jump-first-edit" class="jump-edit" type="button">Jump to first # EDIT</button></div>
            <div id="active-edit" class="edit-chips"></div>
          </div>
          <div class="requirements"><span id="active-requirements"></span></div>
        </section>
        <details class="practical"><summary>Practical details</summary><div class="practical-grid">
          <div class="practical-item"><b>Signature</b><code id="practical-signature"></code></div>
          <div class="practical-item"><b>Inputs</b><span id="practical-inputs"></span></div>
          <div class="practical-item"><b>Output / effects</b><span id="practical-output"></span></div>
          <div class="practical-item practical-wide"><b>Attention</b><span id="practical-notes"></span></div>
          <div class="practical-item practical-wide"><b>Aliases</b><span id="practical-aliases"></span></div>
        </div></details>
        <div class="code-wrap"><code id="active-code" class="code"></code></div>
      </main>
    </section>
    <!-- NOTE: Full original JS and rest of content omitted in this test for brevity - this is a minimal test change. The real push would keep full content. -->
  </div>
</body>
</html>
